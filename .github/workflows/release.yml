name: release

on:
  push:
    tags: ["v*"]

# Mínimo no topo: a suíte (código de terceiros do PyPI) roda sem escrita nem id-token.
permissions:
  contents: read

jobs:
  # Suíte completa (matriz do ci.yml) sobre o mesmo commit da tag, antes de qualquer publicação.
  testes:
    uses: ./.github/workflows/ci.yml

  build:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tag corresponde à versão do pacote
        run: |
          v="v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != versão $v"; exit 1; }
          i="v$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("freoa_verifica/__init__.py").read())[1])')"
          test "$i" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != __version__ $i"; exit 1; }
      - name: Build
        run: |
          python -m pip install --require-hashes -r requirements/build.lock
          python -m build --no-isolation
          cd dist && sha256sum * > SHA256SUMS
      - name: Smoke test do wheel
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --require-hashes -r requirements/ci.lock
          /tmp/v/bin/pip install --no-deps dist/*.whl
          /tmp/v/bin/fv --version
          /tmp/v/bin/fv doctor --offline
      - name: Registrar dependências travadas
        run: |
          # O lock publicado é o próprio lock com hashes que instalou o smoke test, não uma resolução posterior.
          cp requirements/ci.lock dist/requirements-lock.txt
          (cd dist && sha256sum requirements-lock.txt >> SHA256SUMS)
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/requirements-lock.txt
            dist/SHA256SUMS
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rascunho: os bytes são auditados antes de publicar (gh release edit --draft=false);
          # a PyPI sai de pypi.yml, só depois da publicação.
          # Sem substituição de assets: se a release ou um asset já existir, o job falha.
          # Notas = só a seção da versão da tag (nunca o histórico inteiro); sem a seção, o job falha.
          python scripts/notas_da_versao.py "$GITHUB_REF_NAME" CHANGELOG.md "$RUNNER_TEMP/notas.md"
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notas.md" --verify-tag --draft
