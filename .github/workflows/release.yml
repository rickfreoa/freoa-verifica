name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Suíte completa (matriz do ci.yml) sobre o mesmo commit da tag, antes de qualquer publicação.
  testes:
    uses: ./.github/workflows/ci.yml

  build:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
          cd dist && sha256sum * > SHA256SUMS
      - name: Smoke test do wheel
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/fv --version
          /tmp/v/bin/fv doctor --offline
      - name: Registrar dependências resolvidas
        run: |
          /tmp/v/bin/pip install "$(ls dist/*.whl)[server]"
          /tmp/v/bin/pip freeze --exclude freoa-verifica > dist/requirements-lock.txt
          (cd dist && sha256sum requirements-lock.txt >> SHA256SUMS)
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sem substituição de assets: se a release ou um asset já existir, o job falha.
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
