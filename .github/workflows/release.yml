name: release

on:
  push:
    tags: ["v*"]

# Mínimo no topo: a suíte (código de terceiros do PyPI) roda sem escrita nem id-token.
permissions:
  contents: read

jobs:
  # Suíte completa (matriz do ci.yml) sobre o mesmo commit da tag, antes de qualquer publicação.
  testes:
    uses: ./.github/workflows/ci.yml

  build:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tag corresponde à versão do pacote
        run: |
          v="v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != versão $v"; exit 1; }
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
          cd dist && sha256sum * > SHA256SUMS
      - name: Smoke test do wheel
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/fv --version
          /tmp/v/bin/fv doctor --offline
      - name: Registrar dependências resolvidas
        run: |
          /tmp/v/bin/pip install "$(ls dist/*.whl)[server]"
          /tmp/v/bin/pip freeze --exclude freoa-verifica > dist/requirements-lock.txt
          (cd dist && sha256sum requirements-lock.txt >> SHA256SUMS)
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/requirements-lock.txt
            dist/SHA256SUMS
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sem substituição de assets: se a release ou um asset já existir, o job falha.
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  # PyPI por Trusted Publishing: só roda depois que o mantenedor cadastrar o publicador
  # em pypi.org (projeto freoa-verifica, workflow release.yml, ambiente pypi) e definir
  # a variável de repositório PYPI_PUBLICAR=true. Sem isso, o job é pulado, não falha.
  pypi:
    needs: build
    if: vars.PYPI_PUBLICAR == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
