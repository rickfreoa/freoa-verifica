name: saude-das-fontes

# Executa semanalmente os testes contra as fontes oficiais e publica o resultado.
# Várias fontes bloqueiam IPs de datacenter; falha aqui indica acesso, não defeito do código.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: Testes live
        run: python -m pytest -q -m live -rA --junitxml=live.xml || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saude-das-fontes
          path: live.xml
