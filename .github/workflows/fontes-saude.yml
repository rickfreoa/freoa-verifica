name: saude-das-fontes

# Executa semanalmente os testes contra as fontes oficiais e mantém a issue viva `saude-das-fontes`.
# Várias fontes bloqueiam IPs de datacenter: isso vira xfail ambiental e não derruba o job.
# Regressão (ou recusa identificada) derruba o job; execução incompleta também (decisão 0054).
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: Testes live
        run: python -m pytest -q -m live -rA --junitxml=live.xml
      # O resultado do job é o código do script: roda mesmo se os testes falharem.
      - name: Saúde das fontes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/saude_fontes.py --json saude-fontes.json --junit live.xml --issue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: saude-das-fontes
          path: |
            live.xml
            saude-fontes.json
          if-no-files-found: warn
