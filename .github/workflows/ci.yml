name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reutilizado por release.yml (mesmo commit)

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel and test deps
        shell: bash
        run: |
          for wheel in dist/*.whl; do pip install "${wheel}[test,server]"; done
      - name: Test installed package
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
          FV_TEST_INSTALLED: "1"
        run: |
          REPO="$PWD"
          TMPDIR="$(mktemp -d)"
          cp -r "$REPO/tests" "$TMPDIR/tests"
          mkdir -p "$TMPDIR/scripts"
          cp "$REPO/scripts/instalar-freoa-verifica.ps1" "$TMPDIR/scripts/"
          cd "$TMPDIR"
          python -m pytest tests -q -m "not live" -p no:cacheprovider
