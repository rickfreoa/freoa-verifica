name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reutilizado por release.yml (mesmo commit)

permissions:
  contents: read

jobs:
  # CI em camadas: PR que só toca registros (docs/decisoes, docs/auditoria) dispensa a matriz; push na main e
  # release (workflow_call) rodam tudo. Falha deste job não dispensa nada (condição do job test).
  escopo:
    runs-on: ubuntu-latest
    outputs:
      so_registro: ${{ steps.escopo.outputs.so_registro }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: escopo
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CABECA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_escopo.py

  test:
    needs: escopo
    if: ${{ !cancelled() && needs.escopo.outputs.so_registro != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/build.lock
          python -m build --no-isolation
      - name: Install locked deps and wheel
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          for wheel in dist/*.whl; do pip install --no-deps "${wheel}"; done
      - name: Test installed package
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
          FV_TEST_INSTALLED: "1"
        run: |
          REPO="$PWD"
          TMPDIR="$(mktemp -d)"
          cp -r "$REPO/tests" "$TMPDIR/tests"
          mkdir -p "$TMPDIR/scripts"
          cp "$REPO/scripts/instalar-freoa-verifica.ps1" "$TMPDIR/scripts/"
          cd "$TMPDIR"
          python -m pytest tests -q -m "not live and not repositorio" -p no:cacheprovider

  # Testes que leem o checkout (workflows, AST, manifesto de fixtures): não rodam na wheel instalada.
  repositorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked deps and package
        run: |
          python -m pip install --require-hashes -r requirements/build.lock
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Testes de repositório
        run: python -m pytest tests -q -m "repositorio and not live" -p no:cacheprovider

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/lint.lock
      - name: Catraca do Ruff
        run: python scripts/ruff_catraca.py
